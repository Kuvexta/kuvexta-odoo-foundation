# Rollout smoke validated under TASK-000001.
name: Work coordination

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  coordination:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require private coordination read access
        env:
          COORDINATION_READ_TOKEN: ${{ secrets.KUVEXTA_STACK_READ_TOKEN }}
        run: |
          if [ -z "$COORDINATION_READ_TOKEN" ]; then
            echo "::error::KUVEXTA_STACK_READ_TOKEN must include read access to Kuvexta/kuvexta-work-coordination."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Kuvexta/kuvexta-work-coordination
          ref: control
          token: ${{ secrets.KUVEXTA_STACK_READ_TOKEN }}
          path: coordination
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coordination/pyproject.toml
      - run: python -m pip install ./coordination
      - name: Resolve the single Task-ID
        id: task
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re

          text = f"{os.environ.get('PR_TITLE', '')}\n{os.environ.get('PR_BODY', '')}"
          found = sorted(set(re.findall(r"TASK-[0-9]{6}", text)))
          if len(found) != 1:
              raise SystemExit(f"PR must reference exactly one Task-ID; found {found}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"task_id={found[0]}\n")
          PY
      - name: Validate exact PR head against coordination
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          task --root coordination validate-pr
          --task-id "$TASK_ID"
          --repository foundation
          --head-sha "$HEAD_SHA"
          --pull-request "$PR_URL"
