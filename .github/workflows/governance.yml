name: Governance

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0"]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate migration manifest
        run: python3 -m json.tool MIGRATION_MANIFEST.json >/dev/null
