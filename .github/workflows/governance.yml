name: Governance

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  foundation-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate migration manifest
        run: python3 -m json.tool MIGRATION_MANIFEST.json >/dev/null
      - name: Validate Foundation repository boundary
        run: python3 scripts/validate_foundation_repository.py
